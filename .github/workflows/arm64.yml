name: ARM64 fixed-width engine
on:
  push:
    branches: [perf/pi5-arm64]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build main engine on ARM64
        run: make arm64
      - name: Verify known puzzle solution
        run: make arm64-test
      - name: Build OpenSSL SHA2 experiment
        run: make arm64-openssl
      - name: Verify OpenSSL backend
        run: make arm64-openssl-test
      - name: Build hardware SHA2 engine
        run: make arm64-sha2
      - name: Verify SHA2 engine uses hardware instructions
        run: |
          objdump -d keyhunt-arm64-sha2 | grep -Eq 'sha256h2?'
      - name: Verify SHA2 engine recovered all known keys
        run: |
          if grep -qE '(^| )sha2( |$)' /proc/cpuinfo; then
            make arm64-sha2-test
          else
            echo "CPU lacks ARM SHA2 instruction support, only build verified"
          fi
